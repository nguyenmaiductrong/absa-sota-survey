# LCF-BERT config — UIT-VSFC (Vietnamese)
# Run: python models/lcf_bert/train.py --config configs/lcf_bert_vi.yaml

dataset: "UIT-VSFC"

train_file: "data/processed/lcf_bert/vsfc_train.jsonl"
val_file:   "data/processed/lcf_bert/vsfc_val.jsonl"

pretrained_bert_name: "vinai/phobert-base"   # PhoBERT cho tiếng Việt
bert_dim: 768

max_seq_len: 128
local_context_focus: "cdm"
SRD: 3

num_epoch: 5
batch_size: 16
learning_rate: 2.0e-5
l2reg: 1.0e-5
dropout: 0.1
max_grad_norm: 1.0

seed: 42
device: "cuda"

checkpoint_dir: "checkpoints/vsfc"
