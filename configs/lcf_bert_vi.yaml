# LCF-BERT config — UIT-VSFC (Vietnamese)
# Run: python models/lcf_bert/train.py --config configs/lcf_bert_vi.yaml

dataset: "UIT-VSFC"

aspect_map: null

# Map nhãn topic (tiếng Anh) sang priority list keyword tiếng Việt thực sự
# xuất hiện trong câu — để LCF-BERT định vị được aspect span và bật được
# CDM/CDW mask. Khi không tìm thấy keyword nào trong câu, dùng phần tử đầu
# tiên làm fallback.
aspect_surface_map:
  lecturer: ["giảng viên", "giảng dạy", "giảng bài", "thầy cô", "giáo viên", "thầy", "cô ", "dạy"]
  training_program: ["môn học", "giáo trình", "bài giảng", "chương trình", "học phần", "kiến thức", "nội dung"]
  facility: ["cơ sở vật chất", "trang thiết bị", "phòng học", "phòng máy", "phòng lab", "máy chiếu", "thiết bị", "wifi"]
  others: ["khác"]

train_file: "data/processed/lcf_bert/vsfc_train.jsonl"
val_file: "data/processed/lcf_bert/vsfc_val.jsonl"

pretrained_bert_name: "vinai/phobert-base"
bert_dim: 768
max_seq_len: 128
local_context_focus: "cdw"   # cdm | cdw
SRD: 3

use_gold_aspect_input: true
monitor_metric: "sentiment_macro_f1"
# Dừng sớm nếu val không cải thiện (theo monitor_metric) qua N epoch; 0 = tắt.
early_stopping_patience: 3
early_stopping_min_delta: 0.0

num_epoch: 10
batch_size: 8
learning_rate: 2.0e-5
l2reg: 1.0e-5
dropout: 0.1
max_grad_norm: 1.0
use_amp: true
num_workers: 0

seed: 42
device: "cuda"

checkpoint_dir: "checkpoints/vsfc"
